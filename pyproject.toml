[project]
name = "answer-platform-backend"
version = "0.1.0"
description = "FastAPI backend for a class-based short-answer assignment platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beanie>=2.2.0,<3.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1,<0.142.0",
    "pillow>=12.3.0,<13.0.0",
    "pymongo>=4.13.0,<5.0.0,!=4.15.0",
    "pwdlib[argon2,bcrypt]>=0.3.1,<0.4.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "PyJWT>=2.13.0,<3.0.0",
    "python-multipart>=0.0.32,<0.1.0",
    "uvicorn[standard]>=0.52.4,<0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: HTTP tests using an isolated database on a running MongoDB server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
